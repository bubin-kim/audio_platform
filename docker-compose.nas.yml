# 시놀로지 NAS 자체 호스팅 구성 (docs/20)
#
# 실행: NAS의 Container Manager > 프로젝트 > 생성 시 이 파일을 지정하거나,
#       SSH로 접속해 `docker compose -f docker-compose.nas.yml up -d`
#
# 데이터는 전부 NAS 볼륨에 남는다 — 클라우드 요금 0원, 용량은 NAS 크기만큼.
# 컨테이너를 지웠다 다시 만들어도 02_Dataset/, ./db 폴더가 있으면 그대로 이어진다.
#
# 2026-08-27: beep_sound_dataset 폴더로 통합 이전(§2j) 후, 다시
# 01_Projects/01_BeepSound/{01_Raw,02_Dataset,03_Experiment} 3분할 구조로
# 재이전했다(docs/21 §5 항목29). 이 compose.yaml은 03_Experiment 안에
# 있고, uploads/segments/exports는 형제 폴더 02_Dataset 안에 있어
# **절대경로**로 마운트한다 — 01_Raw(mic1·mic2)는 플랫폼이 몰라도 되므로
# 마운트하지 않는다.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정하세요}
      POSTGRES_DB: audio_platform
    volumes:
      # NAS 실제 경로로 바뀐다 (docs/20의 설치 절차 참조)
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio -d audio_platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://audio:${DB_PASSWORD}@db:5432/audio_platform
      # NAS 로컬 저장 — Drive 불필요(요금 0원). 경로는 아래 볼륨과 짝을 이룬다.
      STORAGE_MODE: local
      DATA_DIR: /data
      ACCESS_TOKEN: ${ACCESS_TOKEN:?접속 암호를 .env에 지정하세요}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      # 선택 — 없으면 해당 기능만 꺼진다(P4)
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      PORT: 8000
    volumes:
      # 02_Dataset(형제 폴더)를 절대경로로 마운트 — NAS 실제 경로에 맞춰
      # ${DATASET_DIR}로 오버라이드 가능하게 해뒀다(기본값이 이번 배치 경로).
      - ${DATASET_DIR:-/volume1/@appdata/ContainerManager/all_shares/AURA/01_Projects/01_BeepSound/02_Dataset}/uploads:/data/uploads
      - ${DATASET_DIR:-/volume1/@appdata/ContainerManager/all_shares/AURA/01_Projects/01_BeepSound/02_Dataset}/segments:/data/segments
      - ${DATASET_DIR:-/volume1/@appdata/ContainerManager/all_shares/AURA/01_Projects/01_BeepSound/02_Dataset}/exports:/data/exports
    ports:
      - "${BACKEND_PORT:-8100}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # 브라우저가 접근할 백엔드 주소 — NAS IP나 QuickConnect 주소를 넣는다
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?백엔드 주소를 .env에 지정하세요}
        NEXT_PUBLIC_REQUIRE_AUTH: "true"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
